name: Discussions Notifier

on:
  discussion_comment:
    types: [created, edited]
  discussion:
    types: [created]

permissions:
  discussions: read
  contents: read

concurrency:
  group: th-notify-${{ github.event.action }}-${{ github.actor.login || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: Val-d-emar/discussions-tg-notifications@main
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          # message_thread_id: "12345" # Опционально для топиков
          user_map: ${{ secrets.TELEGRAM_USER_MAP }}
          # формат секрета:
          ####################################
          # gh_nickname=telegram_nickname
          # gh_nickname1=telegram_nickname2
          # ...
          # gh_nicknameN=telegram_nicknameN
          ####################################
          # gh_nickname - логин в гитхабе
          # telegram_nickname - логин в телеграме
          language: "ru"
          events: "created,edited"
